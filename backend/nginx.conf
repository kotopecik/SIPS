
upstream auth_backend {
    server auth-restapi:8000;
}

upstream info_composite_backend {
    server info-composite-data-restapi:8000;
}

upstream composite_backend {
    server composite-data-restapi:8000;
}

upstream web_frontend {
    server web-client:3000;
}

server {
    listen 80;

    location ~* /static/ {
        root /yt/backend;
    }

    location ~* /tiles/.+\.(png)$ {
        root /src/;
    }

    location /api/vAUTH/ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_set_header Host $http_host; # issue a socket
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://auth_backend;
    }
    location /api/vICOD/ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_set_header Host $http_host; # issue a socket
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://info_composite_backend;
    }
    location /api/vCD/ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_set_header Host $http_host; # issue a socket
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://composite_backend;
    }
    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_set_header Host $http_host; # issue a socket
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://web_frontend;
    }
}
