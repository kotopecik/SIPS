version: "2"

services:
  auth_postgres:
    image: postgres:11
    container_name: auth_postgres
    volumes:
      - auth-postgres-volume:/var/lib/postgresql/data
    env_file:
      - ./AuthService/.env
    networks:
      network-auth-restapi:

  auth-restapi:
    expose:
      - 8000
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    container_name: auth-restapi
    restart: unless-stopped
    depends_on:
      - auth_postgres
    volumes:
      - static_volume:/yt/backend/CRUDAPI/static
      - media_volume:/yt/backend/CRUDAPI/media
    env_file:
      - ./AuthService/.env
    environment:
      POSTGRES_HOST: "auth_postgres"
      POSTGRES_PORT: "5432"
      DOCKER_START: 1
    command: bash -c "./run.sh"
    networks:
      network-auth-restapi:

  composite_postgres:
    image: postgres:11
    container_name: composite_postgres
    volumes:
      - composite-postgres-volume:/var/lib/postgresql/data
    env_file:
      - ./InfoCompositeOutputDataRESTAPIService/.env
    environment:
      POSTGRES_HOST: "composite_postgres"
      POSTGRES_PORT: "5432"
    networks:
      network-composite-data-restapi:

  info-composite-data-restapi:
    build:
      context: ./InfoCompositeOutputDataRESTAPIService
      dockerfile: Dockerfile
    container_name: info-composite-data-restapi
    restart: unless-stopped
    env_file:
      - ./InfoCompositeOutputDataRESTAPIService/.env
    environment:
      POSTGRES_HOST: "composite_postgres"
      POSTGRES_PORT: "5432"
      CACHE_REDIS_URL: "redis://@redis:6379/0"
    expose:
      - 8000
    depends_on:
      - composite_postgres
      - redis
    command: bash -c "./run.sh"
    networks:
      network-composite-data-restapi:

  composite-data-restapi:
    build:
      context: ./CompositeDataRESTAPIService
      dockerfile: Dockerfile
    container_name: composite-data-restapi
    restart: unless-stopped
    env_file:
      - ./CompositeDataRESTAPIService/.env
    environment:
      POSTGRES_HOST: "composite_postgres"
      POSTGRES_PORT: "5432"
      CACHE_REDIS_URL: "redis://@redis:6379/0"
    expose:
      - 8000
    depends_on:
      - composite_postgres
      - celery
    command: bash -c "./run.sh"
    volumes:
      - ${PATH_TIFF_IMAGE}:${PATH_TIFF_IMAGE}
    networks:
      network-composite-data-restapi:

#  data-processing:
#    build:
#      context: ./DataProcessingService
#      dockerfile: Dockerfile
#    container_name: data-processing
#    restart: unless-stopped
#    env_file:
#      - ./DataProcessingService/.env
#    environment:
#      POSTGRES_HOST: "composite_postgres"
#      POSTGRES_PORT: "5432"
#      RABBITMQ_HOST: "rabbitmq"
#    depends_on:
#      - composite_postgres
#    command: bash -c "./run.sh"
#    networks:
#      network-composite-data-restapi:

  redis:
    image: redis:5
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      network-composite-data-restapi:
      default:

  rabbitmq:
    image: rabbitmq:3.6.11
    restart: unless-stopped
    expose:
      - "5672"
      - "15672"
    networks:
      network-composite-data-restapi:
      default:

  web-client:
    build:
      context: ../frontend
      dockerfile: ../frontend/Dockerfile
    restart: unless-stopped
    container_name: web-client-container
    expose:
      - "3000"

  nginx:
    image: nginx:1.19
    container_name: nginx
    depends_on:
      - auth-restapi
      - info-composite-data-restapi
      - composite-data-restapi
    ports:
      - "8080:80"
    volumes:
      - static_volume:/yt/backend/static
      - media_volume:/yt/backend/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ${PATH_TO_TILES}:/src/tiles/
      - ${PATH_TO_RU_REGIONS_JSON}:/src/ru-regions-json
    networks:
      network-composite-data-restapi:
      network-auth-restapi:
      default:

  celery:
    build:
      context: .
      dockerfile: CeleryService/Dockerfile
    container_name: celery_service
    env_file:
      - ./CeleryService/.env
    environment:
      POSTGRES_HOST: "composite_postgres"
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKED: "redis://redis:6379/1"
    depends_on:
      - redis
    networks:
      network-composite-data-restapi:

volumes:
  static_volume:
  media_volume:
  auth-postgres-volume:
  composite-postgres-volume:

networks:
  network-composite-data-restapi:
  network-auth-restapi:
