version: "3"

services:
  yt_postgres:
    image: postgres:16
    container_name: yt_postgres
    volumes:
      - yt_postgres-volume:/var/lib/postgresql/data
    env_file:
      - .env

  CRUDAPI:
    expose:
      - 8000
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    image: yt_docker:latest
    container_name: yt_docker
    restart: unless-stopped
    depends_on:
      - yt_postgres
    volumes:
      - cache-python:/root/.cache/pip #$HOME/.cache/pip
      - static_volume:/yt/static
      - media_volume:/yt/media
    env_file:
      - ./AuthService/.env
      - .env
    environment:
      POSTGRES_HOST: "yt_postgres"
      DOCKER_START: 1
    command: >
      bash -c "./CRUDAPI/manage.py collectstatic --noinput && ./CRUDAPI/manage.py makemigrations regauth && ./CRUDAPI/manage.py migrate && ./CRUDAPI/manage.py runserver 0.0.0.0:8000"

  composite_postgres:
    image: postgres:16
    container_name: composite_postgres
    volumes:
      - composite-postgres-volume:/var/lib/postgresql/data
    env_file:
      - ./CompositeDataRESTAPIService/.env
    environment:
      POSTGRES_HOST: "composite_postgres"
      POSTGRES_PORT: "5432"
    networks:
      network-composite-data-restapi:

  composite-data-restapi:
    build:
      context: ./CompositeDataRESTAPIService
      dockerfile: Dockerfile
    container_name: composite-data-restapi
    restart: unless-stopped
    env_file:
      - ./CompositeDataRESTAPIService/.env
    environment:
      POSTGRES_HOST: "composite_postgres"
      POSTGRES_PORT: "5432"
      CACHE_REDIS_URL: "redis://@redis:6379/0"
    expose:
      - 8000
    depends_on:
      - composite_postgres
      - redis
    command: bash -c "./run.sh"
    networks:
      network-composite-data-restapi:

  redis:
    image: redis:7.2
    restart: always
    expose:
      - "6379"
    networks:
      network-composite-data-restapi:
      default:

  nginx:
    image: nginx:1.25
    container_name: nginx
    depends_on:
      - CRUDAPI
      - composite-data-restapi
    ports:
      - "8000:80"
    volumes:
      - static_volume:/yt/static
      - media_volume:/yt/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      network-composite-data-restapi:
      default:

volumes:
  static_volume:
  media_volume:
  yt_postgres-volume:
  cache-python:
  composite-postgres-volume:

networks:
  network-composite-data-restapi:
