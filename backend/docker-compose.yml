version: "3"

services:
  yt_postgres:
    image: postgres:12
    container_name: yt_postgres
    volumes:
      - yt_postgres-volume:/var/lib/postgresql/data
    env_file:
      - .env
    command: -p $POSTGRES_PORT

  CRUDAPI:
    expose:
      - 8000
    build:
      context: .
      dockerfile: Dockerfile
    image: yt_docker:latest
    container_name: yt_docker
    depends_on:
      - yt_postgres
    volumes:
     # - $HOME/.cache/pip:/root/.cache/pip
      - static_volume:/yt/static
      - media_volume:/yt/media
    env_file:
      - .env
    environment:
      POSTGRES_HOST: "yt_postgres"
      DOCKER_START: 1
    command: >
      bash -c "python AuthService/manage.py collectstatic --noinput && python AuthService/manage.py migrate && python AuthService/manage.py runserver 0.0.0.0:8000"

  nginx:
    image: nginx
    container_name: yt_nginx
    depends_on:
      - CRUDAPI
    ports:
      - "8000:80"
    volumes:
      - static_volume:/yt/static
      - media_volume:/yt/media
      - ./nginx.conf:/etc/nginx/nginx.conf

volumes:
  static_volume:
  media_volume:
  yt_postgres-volume:

